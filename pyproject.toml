[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vegas-subtitle-automation"
version = "0.3.1"
description = "Local VEGAS caption corpus extraction, ASR evaluation, and editable subtitle plans"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=2,<3", "imageio-ffmpeg>=0.6,<1"]
asr = ["faster-whisper>=1.2,<2", "numpy>=2,<3", "imageio-ffmpeg>=0.6,<1"]
speaker = ["onnxruntime>=1.20,<2", "kaldi-native-fbank>=1.20,<2", "numpy>=2,<3"]

[project.scripts]
vegas-subtitles = "vegas_subtitles.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
