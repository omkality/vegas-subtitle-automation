name: Release images
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [tools, gpu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image identity
        id: identity
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          echo "repository=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}-${TARGET}" >> "$GITHUB_OUTPUT"
          echo "commit=sha-${COMMIT}-${TARGET}" >> "$GITHUB_OUTPUT"
      - name: Test before publishing
        run: |
          docker build --target tools --tag vegas-subtitles:release-test .
          docker run --rm --entrypoint python vegas-subtitles:release-test -m unittest discover -s tests -v
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.identity.outputs.repository }}:${{ steps.identity.outputs.version }}
            ${{ steps.identity.outputs.repository }}:${{ steps.identity.outputs.commit }}
          provenance: mode=max
          sbom: true
